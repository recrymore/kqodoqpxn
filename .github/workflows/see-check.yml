name: See API Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check See.tg API
        env:
          SEE_API_KEY: ${{ secrets.SEE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          import json
          import time

          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError, URLError

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          token = os.environ.get("SEE_API_KEY", "").strip()

          if not token:
              sys.exit("SEE_API_KEY is missing")

          opener = build_opener(NoRedirect())

          def request(path):
              req = Request(
                  "https://kartoshka.free/v1/" + path,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/json",
                      "User-Agent": "GiftRadar/1.0"
                  }
              )

              try:
                  with opener.open(req, timeout=25) as response:
                      print(path, "HTTP:", response.status)
                      data = json.load(response)

                      if data.get("ok") is not True:
                          sys.exit("Unexpected API response")

                      for key in (
                          "X-Free-Remaining",
                          "X-Request-Cost",
                          "X-Balance"
                      ):
                          value = response.headers.get(key)
                          if value is not None:
                              print(key, value)

                      return data.get("result"), response.headers

              except HTTPError as exc:
                  print("HTTP error:", exc.code)
                  print("CF-Ray:", exc.headers.get("CF-Ray"))
                  sys.exit(1)

              except (URLError, TimeoutError, ValueError):
                  sys.exit("Network or response error")

          print("Checking authorization")
          request("ping")
          time.sleep(1.2)

          print("Checking quota")
          _, headers = request("me")

          remaining = headers.get("X-Free-Remaining", "0")

          try:
              free = int(remaining)
          except ValueError:
              free = 0

          if free < 1:
              sys.exit("Free quota not confirmed. Gift request skipped.")

          time.sleep(1.2)

          print("Checking real NFT")
          gift, _ = request("gift/PlushPepe-1")

          if isinstance(gift, dict):
              for key in ("slug", "title", "num", "model", "backdrop", "pattern"):
                  if key in gift:
                      print(key, json.dumps(gift[key], ensure_ascii=False))

          print("NFT request successful")
          PY
