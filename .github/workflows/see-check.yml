name: See API Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check See.tg API
        env:
          SEE_API_KEY: ${{ secrets.SEE_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time

          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError, URLError

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          token = os.environ.get("SEE_API_KEY", "").strip()

          if not token:
              sys.exit("ERROR: SEE_API_KEY is missing")

          print("SEE_API_KEY: configured")
          print("Starting See.tg API diagnostics")

          opener = build_opener(NoRedirect())

          for method in ("ping", "me"):
              url = "https://kartoshka.free/v1/" + method

              print(f"\nChecking endpoint: {method}")

              req = Request(
                  url,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/json"
                  }
              )

              try:
                  with opener.open(req, timeout=20) as response:
                      print(f"HTTP status: {response.status}")

                      data = json.load(response)

                      if not isinstance(data, dict) or data.get("ok") is not True:
                          sys.exit("Unexpected API response")

                      print(f"{method}: OK")

                      for key in (
                          "X-Free-Remaining",
                          "X-Request-Cost",
                          "X-Balance",
                          "X-RateLimit-Limit",
                          "X-RateLimit-Remaining"
                      ):
                          value = response.headers.get(key)

                          if value is not None:
                              try:
                                  print(f"{key}: {float(value):g}")
                              except ValueError:
                                  pass

              except HTTPError as exc:
                  print("\n--- HTTP ERROR ---")
                  print(f"Endpoint: {method}")
                  print(f"HTTP status: {exc.code}")
                  print(f"Server: {exc.headers.get('Server')}")
                  print(f"Content-Type: {exc.headers.get('Content-Type')}")
                  print(f"CF-Ray: {exc.headers.get('CF-Ray')}")
                  print(f"Retry-After: {exc.headers.get('Retry-After')}")
                  print("------------------")
                  sys.exit(1)

              except (URLError, TimeoutError, ValueError):
                  sys.exit("ERROR: Network or JSON error")

              time.sleep(1.1)

          print("\nSee API connection OK")
          PY
