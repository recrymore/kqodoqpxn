name: See API Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check See.tg API
        env:
          SEE_API_KEY: ${{ secrets.SEE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          import json
          import time

          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError, URLError

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          token = os.environ.get("SEE_API_KEY", "").strip()

          if not token:
              sys.exit("SEE_API_KEY missing")

          opener = build_opener(NoRedirect())

          def request(path):
              req = Request(
                  "https://kartoshka.free/v1/" + path,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/json",
                      "User-Agent": "GiftRadar/1.0"
                  }
              )

              try:
                  with opener.open(req, timeout=25) as response:
                      print(path, "HTTP:", response.status)
                      data = json.load(response)

                      if not isinstance(data, dict) or data.get("ok") is not True:
                          sys.exit("Unexpected API response")

                      print("Free remaining:",
                            response.headers.get("X-Free-Remaining"))
                      print("Request cost:",
                            response.headers.get("X-Request-Cost"))

                      return data.get("result"), response.headers

              except HTTPError as exc:
                  print("HTTP error:", exc.code)
                  print("CF-Ray:", exc.headers.get("CF-Ray"))
                  sys.exit(1)

              except (URLError, TimeoutError, ValueError):
                  sys.exit("Network or response error")

          print("Checking new token")
          _, headers = request("ping")

          try:
              remaining = int(headers.get("X-Free-Remaining", "0"))
          except ValueError:
              remaining = 0

          if remaining < 1:
              sys.exit("Free quota unavailable. Search skipped.")

          time.sleep(1.2)

          print("Checking gift search")
          result, _ = request("gifts?limit=5")

          if isinstance(result, dict):
              print("Result fields:", list(result.keys()))

              for key, value in result.items():
                  if isinstance(value, list):
                      print("List:", key, "Count:", len(value))

                      if value and isinstance(value[0], dict):
                          print("Item fields:", list(value[0].keys()))

          elif isinstance(result, list):
              print("Items:", len(result))

              if result and isinstance(result[0], dict):
                  print("Item fields:", list(result[0].keys()))

          print("Gift search request successful")
          PY
