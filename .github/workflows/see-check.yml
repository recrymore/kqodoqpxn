name: See API Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check See.tg API
        env:
          SEE_API_KEY: ${{ secrets.SEE_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys, time
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError, URLError

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          token = os.environ.get('SEE_API_KEY', '').strip()
          if not token:
              sys.exit('SEE_API_KEY is missing or empty')
          opener = build_opener(NoRedirect())
          for method in ('ping', 'me'):
              req = Request('https://kartoshka.free/v1/' + method,
                            headers={'Authorization': 'Bearer ' + token,
                                     'Accept': 'application/json'})
              try:
                  with opener.open(req, timeout=20) as response:
                      print(f'{method}: HTTP {response.status}', flush=True)
                      data = json.load(response)
                      if not isinstance(data, dict) or data.get('ok') is not True:
                          sys.exit(f'{method}: unexpected API response')
                      print(f'{method}: OK', flush=True)
                      for key in ('X-Free-Remaining', 'X-Request-Cost', 'X-Balance', 'X-RateLimit-Limit', 'X-RateLimit-Remaining'):
                          value = response.headers.get(key)
                          if value is not None:
                              try:
                                  print(f'{key}: {float(value):g}', flush=True)
                              except ValueError:
                                  pass
              except HTTPError as exc:
                  sys.exit(f'{method}: HTTP {exc.code}; check API access or limits')
              except (URLError, TimeoutError, ValueError):
                  sys.exit(f'{method}: network or JSON error')
              time.sleep(1.1)
          print('See API connection OK', flush=True)
          PY
