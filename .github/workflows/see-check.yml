name: See API Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check See.tg API
        env:
          SEE_API_KEY: ${{ secrets.SEE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          import json
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError, URLError

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          token = os.environ.get("SEE_API_KEY", "").strip()

          if not token:
              sys.exit("SEE_API_KEY is missing")

          print("SEE_API_KEY: configured")

          req = Request(
              "https://kartoshka.free/v1/ping",
              headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/json"
              }
          )

          try:
              with build_opener(NoRedirect()).open(req, timeout=20) as response:
                  print("HTTP status:", response.status)
                  data = json.load(response)
                  print("API OK:", data.get("ok") is True)

          except HTTPError as exc:
              print("HTTP status:", exc.code)
              print("Server:", exc.headers.get("Server"))
              print("CF-Ray:", exc.headers.get("CF-Ray"))
              print("CF-Error-Type:", exc.headers.get("CF-Error-Type"))
              print("CF-Error-Origin:", exc.headers.get("CF-Error-Origin"))

              try:
                  data = json.loads(exc.read(8192))
                  for key in ("error", "error_code", "code", "message", "detail"):
                      value = data.get(key)
                      if isinstance(value, (str, int)):
                          safe = str(value).replace(token, "[REDACTED]")
                          print(key + ":", repr(safe[:500]))
              except Exception:
                  print("No readable JSON error")

              sys.exit(1)

          except URLError:
              sys.exit("Network error")
          PY
