name: Tracker Bot V8 test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tracker-test
  cancel-in-progress: true

jobs:
  test-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests
        run: python -m unittest discover -v

      - name: Install tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

      - name: Start Tracker V8
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SEE_API_KEY: ${{ secrets.SEE_API_KEY }}
          HOST: '127.0.0.1'
          PORT: '8000'
        run: |
          test -n "$BOT_TOKEN" || { echo "BOT_TOKEN missing"; exit 1; }
          test -n "$SEE_API_KEY" || { echo "SEE_API_KEY missing"; exit 1; }

          echo "BOT_TOKEN: configured"
          echo "SEE_API_KEY: configured"

          ./cloudflared tunnel --url http://127.0.0.1:8000 > tunnel.log 2>&1 &

          for i in $(seq 1 60); do
            WEBAPP_URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1 || true)
            [ -n "$WEBAPP_URL" ] && break
            sleep 2
          done

          test -n "$WEBAPP_URL"
          export WEBAPP_URL

          echo "Mini App: $WEBAPP_URL"
          python -u app.py