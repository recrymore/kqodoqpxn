<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>Gift Tracker</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box} :root{color-scheme:dark;--fg:#fafafa;--muted:#96959e;--panel:#18181b;--blue:#0a84ff;--line:#ffffff0d;--bg:radial-gradient(ellipse at 0 0,#1d1b47 0,transparent 45%),radial-gradient(ellipse at 100% 0,#00182b 0,transparent 40%),radial-gradient(ellipse at 75% 36%,#1b080e 0,transparent 42%),#000}body{margin:0;color:var(--fg);background:#000;font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}button:active{opacity:.78}#app{max-width:540px;margin:auto;min-height:100dvh;background:var(--bg);background-attachment:fixed;padding:14px 17px calc(110px + env(safe-area-inset-bottom));padding-top:max(14px,env(safe-area-inset-top))}.banner{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:14px 16px;margin-bottom:32px;font-size:16px;line-height:1.25}.banner span{flex:1;white-space:pre-wrap;overflow-wrap:anywhere}.banner button{background:#252528;border-radius:30px;padding:11px 14px;color:#aaaab2}.banner a{color:var(--blue)}h1{font-size:35px;letter-spacing:-1.3px;margin:0 4px 14px;font-weight:650}p{margin:0;line-height:1.43;color:var(--muted)}.lead{margin:0 4px 18px}.section{margin:25px 17px 9px;color:var(--muted);font-size:14px}.panel{border:1px solid var(--line);border-radius:27px;background:var(--panel);overflow:hidden}.item{display:flex;align-items:center;width:100%;text-align:left;gap:13px;padding:17px;min-height:74px}.item+.item{border-top:1px solid var(--line)}.item .copy{flex:1;min-width:0}.item strong{font-size:17px;font-weight:550;display:block;overflow-wrap:anywhere}.sub{display:block;color:var(--muted);font-size:15px;line-height:1.35;margin-top:4px;overflow-wrap:anywhere}.icon{width:43px;height:43px;border-radius:13px;background:#202b3d;color:#88b5ff;display:grid;place-items:center;flex-shrink:0}.icon.green{background:#19332e;color:#57e2b2}.icon.purple{background:#2c263b;color:#bba4ff}.icon.blue{background:#142a40;color:#67b5ff}svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.chev{width:15px;height:15px;color:#fff;flex-shrink:0}.primary{background:linear-gradient(110deg,#5956cf,#287deb);border-radius:14px;font-weight:550;min-height:53px;padding:12px 15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}.secondary{background:#29292c;border-radius:14px;padding:12px;min-height:47px}.empty{padding:27px 16px;color:#777780;text-align:center;font-size:16px}.profile{text-align:center;margin:36px 0 39px}.avatar{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:#38383f;font-size:42px;font-weight:650;margin:0 auto 17px}.profile h2{font-size:27px;margin:0 0 4px;overflow-wrap:anywhere}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:24px;min-height:135px;padding:16px}.stat svg{color:var(--blue);margin-bottom:12px}.stat b{display:block;font-size:32px;margin-top:8px}.pad{padding:17px}.nav{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 40px),500px);display:grid;grid-template-columns:repeat(3,1fr);padding:8px;background:#19191eea;backdrop-filter:blur(18px);border:1px solid #ffffff13;border-radius:40px;z-index:3}.nav button{display:grid;justify-items:center;gap:5px;color:#777780;font-size:12px;border-radius:30px;padding:7px 0}.nav button svg{width:26px;height:26px}.nav .active{background:#2a2a2e;color:#fff}.nav .active svg{color:var(--blue)}.back{color:var(--blue);padding:0 4px 15px;display:flex;align-items:center;gap:5px}.back svg{width:17px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.switch{width:52px;height:31px;border-radius:22px;background:#3b3b40;position:relative;flex:0 0 52px}.switch:after{content:'';width:27px;height:27px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:transform .15s}.switch.on{background:#2db955}.switch.on:after{transform:translateX(21px)}textarea,input{width:100%;border:0;background:#ffffff04;border-radius:12px;padding:13px;outline:none}textarea{resize:vertical;min-height:118px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.chip{background:#142a40;color:#9ecfff;padding:7px 10px;border-radius:10px}.stepper{display:flex;align-items:center;gap:12px}.stepper button{border-radius:50%;background:#27272a;width:38px;height:38px;font-size:24px}.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;text-align:center}.themes button{font-size:12px;color:var(--muted);padding:0}.swatch{height:57px;border:1px solid #ffffff15;border-radius:16px;margin-bottom:6px}.themes .selected .swatch{border:2px solid var(--blue)}.hint{font-size:13px;margin:9px 16px;color:#777780}.link{color:var(--muted);text-decoration:underline;padding:16px 12px;text-align:left}.veil{position:fixed;inset:0;background:#0009;z-index:5;display:flex;justify-content:center;align-items:flex-end}.sheet{width:min(100%,540px);background:#111113;border:1px solid #ffffff0a;border-radius:30px 30px 0 0;padding:12px 17px calc(28px + env(safe-area-inset-bottom));display:grid;gap:13px}.handle{width:40px;height:5px;border-radius:5px;background:#303034;margin:0 auto 3px}.sheet h2{font-size:22px;margin:0 4px}.sheet textarea{background:#1c1c1f}.sheet .secondary{width:100%}.sheet .primary{min-height:56px}.notice{font-size:12px;text-align:center;color:#92929d;line-height:1.4}.hidden{display:none!important}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.toast{position:fixed;z-index:10;bottom:105px;left:50%;transform:translateX(-50%);max-width:90%;background:#33333a;border-radius:15px;padding:12px 18px;text-align:center;font-size:14px;box-shadow:0 8px 30px #0008}
</style></head><body><main id="app"><div id="banner" class="banner"></div><div id="screen"></div><nav id="nav" class="nav"></nav></main><div id="modal"></div><script>
const paths={radar:'<circle cx="12" cy="12" r="9" stroke-dasharray="46 11"/><circle cx="12" cy="12" r="5" stroke-dasharray="24 6"/><circle cx="12" cy="12" r="1.5"/><path d="m12 12 8-8"/>',sliders:'<path d="M4 6h16M4 12h16M4 18h16M8 3v6M16 9v6M10 15v6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',shield:'<path d="M12 3 4 6v6c0 5 4 8 8 10 4-2 8-5 8-10V6zM8 12l3 3 5-5"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 8-3 8-3 10h18c0-2-3-2-3-10M10 21h4"/>',chat:'<path d="M21 11.5a9 9 0 0 1-9 9 10 10 0 0 1-4-.9L3 21l1.4-5A9 9 0 1 1 21 11.5z"/>',wallet:'<rect x="3" y="5" width="17" height="15" rx="2"/><path d="M3 9h17M21 12h-6a2 2 0 0 0 0 4h6z"/>',code:'<path d="m9 5-7 7 7 7m6-14 7 7-7 7"/>',send:'<path d="m3 10 19-7-7 19-4-9-8-3zm8 3L22 3"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/>',chev:'<path d="m9 6 6 6-6 6"/>',back:'<path d="m15 6-6 6 6 6"/>',flag:'<path d="M4 22V3c6-4 10 4 16 0v12c-6 4-10-4-16 0"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',gift:'<rect x="3" y="8" width="18" height="5" rx="1"/><path d="M5 13v8h14v-8M12 8v13M12 8C3 8 5 0 9 4l3 4c9 0 7-8 3-4z"/>',alert:'<path d="M10 4 2 19h20L14 4a2 2 0 0 0-4 0zM12 9v4m0 3v.1"/>',copy:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 5V3H3v13h2"/>'};
const icon=(n,c='')=>`<svg class="${c}" viewBox="0 0 24 24" aria-hidden="true">${paths[n]||''}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaultConfig={title:'Трекер подарков',banner:'@team_example панель тимы для ворка',banner_enabled:true,tariffs:[{days:1,price:null},{days:3,price:null},{days:7,price:null}],referral_hours:6,support:'',version:1};let cfg=structuredClone(defaultConfig), page='profile', dismissed=null, supportTickets=[], supportStatus='';const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand()}catch(e){}const user=tg?.initDataUnsafe?.user||{first_name:'Пользователь',username:'demo'};const name=[user.first_name,user.last_name].filter(Boolean).join(' ');let prefs={fullscreen:false,notify:true,vibration:true,count:5,theme:'black'};try{prefs={...prefs,...JSON.parse(localStorage.getItem('trackerPrefs')||'{}')}}catch(e){}const themes={black:'radial-gradient(ellipse at 0 0,#1d1b47 0,transparent 45%),radial-gradient(ellipse at 100% 0,#00182b 0,transparent 40%),radial-gradient(ellipse at 75% 36%,#1b080e 0,transparent 42%),#000',graphite:'#151517',night:'radial-gradient(ellipse at 0 0,#173955,transparent 60%),#020710',violet:'radial-gradient(ellipse at 0 0,#43255e,transparent 65%),#08040e'};
function save(){try{localStorage.setItem('trackerPrefs',JSON.stringify(prefs))}catch(e){}}function toast(msg){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),2400)}function go(p){page=p;render();window.scrollTo(0,0);if(['support','notifications'].includes(p))loadTickets()}function closeSheet(){document.getElementById('modal').innerHTML=''}function sheet(title,body){document.getElementById('modal').innerHTML=`<div class="veil" onclick="if(event.target===this)closeSheet()"><section class="sheet" role="dialog" aria-modal="true"><div class="handle"></div><h2>${esc(title)}</h2>${body}<button class="link" onclick="closeSheet()">Закрыть</button></section></div>`}function row(i,title,sub,action='',color='blue'){return `<button class="item" ${action?`onclick="${action}"`:''}><span class="icon ${color}">${icon(i)}</span><span class="copy"><strong>${esc(title)}</strong>${sub?`<span class="sub">${esc(sub)}</span>`:''}</span>${action?icon('chev','chev'):''}</button>`}function panel(s){return `<div class="panel">${s}</div>`}function heading(s){return `<button class="back" onclick="go('profile')">${icon('back')}Профиль</button><h1>${s}</h1>`}function section(s){return `<div class="section">${s}</div>`}function toggle(key,t,s=''){return `<div class="item"><div class="copy"><strong>${t}</strong>${s?`<span class="sub">${s}</span>`:''}</div><button aria-label="${t}" aria-pressed="${prefs[key]}" class="switch ${prefs[key]?'on':''}" onclick="flip('${key}')"></button></div>`}function flip(k){if(k==='fullscreen'){try{if(!prefs[k]&&tg?.requestFullscreen)tg.requestFullscreen();else if(prefs[k]&&tg?.exitFullscreen)tg.exitFullscreen();else{toast('Доступно в Telegram');return}}catch(e){toast('Полноэкранный режим недоступен');return}}prefs[k]=!prefs[k];save();render()}function count(n){prefs.count=Math.max(1,Math.min(20,prefs.count+n));save();render()}function theme(k){prefs.theme=k;save();render()}
function render(){document.title=cfg.title;document.documentElement.style.setProperty('--bg',themes[prefs.theme]||themes.black);let b=document.getElementById('banner');b.classList.toggle('hidden',!cfg.banner_enabled||!cfg.banner||dismissed===cfg.banner);b.innerHTML=`<span>${esc(cfg.banner).replace(/(^|\s)(@[a-zA-Z0-9_]{5,32})(?=\s|$)/g,'$1<a href="https://t.me/$2" onclick="event.preventDefault();openHandle(\'$2\')">$2</a>')}</span><button onclick="dismissed=cfg.banner;render()">Понятно</button>`;let s='';if(page==='profile'){s=`<div class="profile"><div class="avatar">${esc(name[0]||'U')}</div><h2>${esc(name)}</h2><p>${user.username?'@'+esc(user.username):'Telegram'}</p></div>${panel(row('shield','Подписки нет','Купить доступ','go(\'subscription\')'))}${section('Аккаунт')}${panel(row('bell','Уведомления','Ответы поддержки, оплаты',"go('notifications')")+row('chat','Поддержка','Вопрос, оплата, жалоба',"go('support')")+row('wallet','Подписка','Продлить, тарифы, оплата',"go('subscription')",'green')+row('code','API','Для своих ботов и скриптов',"go('api')")+row('send','Мой бот','Подключение бота',"go('mybot')",'purple'))}${section('Статистика')}<div class="stats">${[['radar','Выдано сегодня'],['flag','Занято сегодня'],['grid','Выдано всего'],['target','Занято всего']].map(([i,t])=>`<div class="stat">${icon(i)}<p>${t}</p><b>—</b></div>`).join('')}</div>${section('Пригласить друга')}${panel(`<div class="pad"><strong style="font-size:19px">🎁 +${cfg.referral_hours} часов за друга</strong><p style="margin:12px 0">Бонус за покупку подписки по приглашению</p><button class="primary" onclick="toast('Реферальная система пока не подключена')">${icon('send')} Поделиться</button></div>`)}`}
else if(page==='subscription'){s=heading('Подписка')+panel(row('lock','Подписки нет','Трекер, Поиск и Лента откроются после оплаты','','purple'))+section('Тарифы')+panel(cfg.tariffs.map((t,i)=>`<button class="item" onclick="tariff(${i})"><span class="copy"><strong>${days(t.days)}</strong><span class="sub">${t.price===null?'Цена уточняется':esc(t.price)+' GRAM'}</span></span>${icon('chev','chev')}</button>`).join('')||'<div class="empty">Тарифов пока нет</div>')+'<p class="hint">Время добавится к остатку</p><button class="link" onclick="promo()">Есть промокод?</button>'}
else if(page==='settings'){s='<h1>Настройки</h1>'+section('Экран')+panel(toggle('fullscreen','Во весь экран','Доступно в актуальной версии Telegram'))+section('Выдача')+panel(`<div class="item"><div class="copy"><strong>За раз по умолчанию</strong></div><div class="stepper"><button onclick="count(-1)">−</button><b>${prefs.count}</b><button onclick="count(1)">+</button></div></div>`+toggle('notify','Сообщать, когда подборка готова','Уведомление после завершения поиска')+toggle('vibration','Вибрация'))+section('Оформление')+panel(`<div class="pad themes">${Object.entries({black:'Чёрная',graphite:'Графит',night:'Ночная',violet:'Фиолетовая'}).map(([k,t])=>`<button class="${prefs.theme===k?'selected':''}" onclick="theme('${k}')"><div class="swatch" style="background:${themes[k]}"></div>${t}</button>`).join('')}</div>`)}
else if(page==='support'){s=heading('Поддержка')+'<p class="lead">Ответ придёт сюда, уведомлением и в Telegram</p><div class="row"><button class="primary" onclick="support(false)">'+icon('chat')+' Задать вопрос</button><button class="secondary" onclick="support(true)">'+icon('alert')+' Пожаловаться</button></div>'+section('Мои обращения')+panel(ticketList(false))+(cfg.support?`<p class="hint">Контакт: ${esc(cfg.support)}</p>`:'')}
else if(page==='api'){s=heading('API')+'<p class="lead">Тот же трекер для своих ботов и скриптов. Отдельная подписка.</p>'+panel('<div class="empty">API пока не подключён</div>')}
else if(page==='notifications'){s=heading('Уведомления')+panel(ticketList(true))}
else if(page==='mybot'){s=heading('Мой бот')+panel('<div class="empty">Подключение ботов пока недоступно</div>')}
else{s='<h1>Трекер</h1>'+panel(row('lock','Подписки нет','Трекер пока на этапе оформления.',"go('subscription')",'purple'))+'<p class="hint">Поиск, лента и мониторинг будут подключены отдельно.</p>'}document.getElementById('screen').innerHTML=s;document.getElementById('nav').innerHTML=[['tracker','radar','Трекер'],['settings','sliders','Настройки'],['profile','user','Профиль']].map(([p,i,t])=>`<button class="${(page===p||(p==='profile'&&!['tracker','settings'].includes(page)))?'active':''}" onclick="go('${p}')">${icon(i)}${t}</button>`).join('')}
function promo(){sheet('Промокод',`<input placeholder="Введите промокод"><button class="primary" onclick="toast('Промокоды пока не подключены')">Активировать</button>`)}function days(n){return n+' '+(n%100>=11&&n%100<=14?'дней':n%10===1?'день':n%10>=2&&n%10<=4?'дня':'дней')}function tariff(i){const t=cfg.tariffs[i];sheet('Подписка · '+days(t.days),`<div class="panel pad"><p>К оплате</p><h2 style="margin:8px 0">${t.price===null?'Цена не задана':esc(t.price)+' GRAM'}</h2><p>Tonkeeper</p></div><button class="primary" onclick="toast('Оплата пока не подключена')">Оплатить</button><p class="notice">Визуальный макет. Платёж не создаётся.</p>`)}function ticketList(onlyReplies){const list=onlyReplies?supportTickets.filter(t=>t.reply):supportTickets;if(!list.length)return `<div class="empty">${esc(supportStatus||(onlyReplies?'Уведомлений пока нет':'Обращений пока нет'))}</div>`;return list.map(t=>`<div class="item"><div class="copy"><strong>№${t.id} · ${t.kind==='complaint'?'Жалоба':'Вопрос'}</strong><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(t.body)}</p><span class="sub">${t.reply?'Ответ получен':'Ожидает ответа'}</span>${t.reply?`<p style="color:var(--fg);white-space:pre-wrap;overflow-wrap:anywhere">${esc(t.reply)}</p>`:''}</div></div>`).join('')}
async function requestApi(path,data={}){if(!tg?.initData)throw Error('Открой Mini App в Telegram');const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,initData:tg.initData})});const result=await r.json();if(!r.ok)throw Error(result.error||'Ошибка сервера');return result}
async function loadTickets(){if(!tg?.initData)return;try{const result=await requestApi('/api/tickets');supportTickets=result.tickets;supportStatus=''}catch(e){supportStatus=e.message}if(['support','notifications'].includes(page))render()}
function support(complaint){sheet(complaint?'Жалоба':'Вопрос в поддержку',`<textarea id="ticketBody" maxlength="2000" placeholder="Что случилось? Номер платежа, если есть"></textarea><button class="secondary" disabled>＋ Скрин (позже)</button><button class="primary" id="ticketSend" onclick="submitTicket(${complaint})">${icon('send')} Отправить</button><p class="notice">${tg?.initData?'Ответ появится в разделе поддержки':'Предпросмотр: отправка доступна в Telegram'}</p>`)}
async function submitTicket(complaint){const field=document.getElementById('ticketBody'),btn=document.getElementById('ticketSend');if(!field.value.trim()){toast('Введите текст обращения');return}btn.disabled=true;try{const result=await requestApi('/api/ticket',{kind:complaint?'complaint':'question',body:field.value});closeSheet();toast('Обращение №'+result.id+' принято');await loadTickets()}catch(e){toast(e.message);btn.disabled=false}}
function openHandle(handle){let url='https://t.me/'+handle.slice(1);if(tg?.initData&&tg.openTelegramLink)tg.openTelegramLink(url);else window.open(url,'_blank','noopener')}
async function sync(){if(location.protocol==='file:')return;try{let r=await fetch('/api/config',{cache:'no-store'});if(!r.ok)return;let next=await r.json();if(next.version!==cfg.version||JSON.stringify(next)!==JSON.stringify(cfg)){cfg=next;render()}}catch(e){}}render();sync();setInterval(sync,5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){sync();if(['support','notifications'].includes(page))loadTickets()}});setInterval(()=>{if(!document.hidden&&['support','notifications'].includes(page)&&!document.querySelector('.sheet'))loadTickets()},15000);
</script></body></html>
