const defaultConfig={title:'Gift Radar • Discover',banner:'Бесплатный трекер подарков',banner_enabled:true,support:'',version:1,group_url:'https://t.me/ZergowNft',access_text:'Один шаг — и все возможности трекера твои. Подпишись на наше сообщество и подтверди подписку.'};let cfg=structuredClone(defaultConfig),page='tracker',dismissed=null,supportTickets=[],supportStatus='',membership=null,found=[],busy=false,searchStatus='',mode='random',budget='all',filters={collection:'',model:'',backdrop:'',symbol:''};const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand()}catch(e){}const user=tg?.initDataUnsafe?.user||{first_name:'Пользователь',username:'demo'};const name=[user.first_name,user.last_name].filter(Boolean).join(' ');let prefs={fullscreen:false,notify:true,vibration:true,count:3,theme:'black'};try{prefs={...prefs,...JSON.parse(localStorage.getItem('trackerPrefs')||'{}')}}catch(e){}const themes={black:'radial-gradient(ellipse at 80% 0,#262343 0,transparent 48%),#090a10',graphite:'#151517',night:'radial-gradient(ellipse at 0 0,#173955,transparent 60%),#020710',violet:'radial-gradient(ellipse at 0 0,#43255e,transparent 65%),#08040e'};
function save(){try{localStorage.setItem('trackerPrefs',JSON.stringify(prefs))}catch(e){}}function toast(msg){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),2400)}function go(p){page=p;render();window.scrollTo(0,0);if(['support','notifications'].includes(p))loadTickets()}function closeSheet(){document.getElementById('modal').innerHTML=''}function sheet(title,body){document.getElementById('modal').innerHTML=`<div class="veil" onclick="if(event.target===this)closeSheet()"><section class="sheet" role="dialog" aria-modal="true"><div class="handle"></div><h2>${esc(title)}</h2>${body}<button class="link" onclick="closeSheet()">Закрыть</button></section></div>`}function row(i,title,sub,action='',color='blue'){return `<button class="item" ${action?`onclick="${action}"`:''}><span class="icon ${color}">${icon(i)}</span><span class="copy"><strong>${esc(title)}</strong>${sub?`<span class="sub">${esc(sub)}</span>`:''}</span>${action?icon('chev','chev'):''}</button>`}function panel(s){return `<div class="panel">${s}</div>`}function heading(s){return `<button class="back" onclick="go('profile')">${icon('back')}Профиль</button><h1>${s}</h1>`}function section(s){return `<div class="section">${s}</div>`}function toggle(key,t,s=''){return `<div class="item"><div class="copy"><strong>${t}</strong>${s?`<span class="sub">${s}</span>`:''}</div><button aria-label="${t}" aria-pressed="${prefs[key]}" class="switch ${prefs[key]?'on':''}" onclick="flip('${key}')"></button></div>`}function flip(k){if(k==='fullscreen'){try{if(!prefs[k]&&tg?.requestFullscreen)tg.requestFullscreen();else if(prefs[k]&&tg?.exitFullscreen)tg.exitFullscreen();else{toast('Доступно в Telegram');return}}catch(e){toast('Полноэкранный режим недоступен');return}}prefs[k]=!prefs[k];save();render()}function count(n){prefs.count=Math.max(1,Math.min(3,prefs.count+n));save();render()}function theme(k){prefs.theme=k;save();render()}
function render(){document.title=cfg.title;document.documentElement.style.setProperty('--photo-tint',({black:'rgba(11,10,20,.22)',graphite:'rgba(28,28,28,.32)',night:'rgba(6,22,43,.40)',violet:'rgba(50,20,70,.38)'})[prefs.theme]||'rgba(11,10,20,.22)');let b=document.getElementById('banner');b.classList.toggle('hidden',!cfg.banner_enabled||!cfg.banner||dismissed===cfg.banner);b.innerHTML=`<span>${esc(cfg.banner).replace(/(^|\s)(@[a-zA-Z0-9_]{5,32})(?=\s|$)/g,'$1<a href="https://t.me/$2" onclick="event.preventDefault();openHandle(\'$2\')">$2</a>')}</span><button onclick="dismissed=cfg.banner;render()">Понятно</button>`;let s='';if(page==='profile'){s=`<div class="profile"><div class="avatar">${esc(name[0]||'U')}</div><h2>${esc(name)}</h2><p>${user.username?'@'+esc(user.username):'Telegram'}</p></div>${panel(row('shield','Бесплатный доступ',membership?.member?'Участие подтверждено':'Подпишись на @ZergowNft',"go('access')",'green'))}${section('Аккаунт')}${panel(row('bell','Уведомления','Ответы поддержки',"go('notifications')")+row('chat','Поддержка','Вопрос или жалоба',"go('support')"))}`}
else if(page==='delivery'){s=heading('Доставка NFT')+deliveryPanel()}
else if(page==='access'){s=heading('Доступ')+accessPanel()}
else if(page==='settings'){s='<h1>Настройки</h1>'+section('Экран')+panel(toggle('fullscreen','Во весь экран','Доступно в актуальной версии Telegram'))+section('Выдача')+panel(row('send','Куда присылать NFT',membership?.delivery?.title||'Личный чат с ботом',"go('delivery')"))+panel(`<div class="item"><div class="copy"><strong>За раз по умолчанию</strong></div><div class="stepper"><button onclick="count(-1)">−</button><b>${prefs.count}</b><button onclick="count(1)">+</button></div></div>`+toggle('vibration','Вибрация'))+section('Оформление')+panel(`<div class="pad themes">${Object.entries({black:'Чёрная',graphite:'Графит',night:'Ночная',violet:'Фиолетовая'}).map(([k,t])=>`<button class="${prefs.theme===k?'selected':''}" onclick="theme('${k}')"><div class="swatch" style="background:${themes[k]}"></div>${t}</button>`).join('')}</div>`)}
else if(page==='support'){s=heading('Поддержка')+'<p class="lead">Ответ придёт сюда, уведомлением и в Telegram</p><div class="row"><button class="primary" onclick="support(false)">'+icon('chat')+' Задать вопрос</button><button class="secondary" onclick="support(true)">'+icon('alert')+' Пожаловаться</button></div>'+section('Мои обращения')+panel(ticketList(false))+(cfg.support?`<p class="hint">Контакт: ${esc(cfg.support)}</p>`:'')}
else if(page==='notifications'){s=heading('Уведомления')+panel(ticketList(true))}
else if(!membership?.member){s=`<div class="eyebrow">GIFT RADAR / DISCOVER</div><h1>Трекер</h1>${accessPanel()}`}
else{s=`<div class="eyebrow">GIFT RADAR / DISCOVER</div><h1>Трекер</h1><p class="lead">Коллекционные подарки Telegram.</p>${panel(row('send','Доставка подборок',membership?.delivery?.title||'Личный чат с ботом',"go('delivery')"))}<div class="modegrid">${[['random','🎲 Случайные'],['prices','💎 По цене'],['filters','🎛 Фильтры']].map(([k,t])=>`<button class="${mode===k?'active':''}" onclick="switchMode('${k}')">${t}</button>`).join('')}</div><div class="hero"><div class="hero-label">${icon('radar')} ${mode==='prices'?'PRICE CATALOG':mode==='filters'?'CUSTOM FILTERS':'RANDOM FINDER'}</div><h2>${mode==='prices'?'Подборка по бюджету':mode==='filters'?'Расширенный поиск':'Случайные NFT'}</h2><p>${mode==='prices'?'Цены из каталога администратора, не live-рынок.':mode==='filters'?'Укажи нужные свойства. Пустые поля не ограничивают подборку.':'Подборка публичных карточек подарков.'}</p>${mode==='prices'?`<div class="budgetgrid">${[['low','До 5 TON'],['mid','5–20 TON'],['high','20+ TON'],['all','Все цены']].map(([k,t])=>`<button class="${budget===k?'active':''}" onclick="budget='${k}';render()">${t}</button>`).join('')}</div>`:mode==='filters'?`<div class="filterfields"><label>Коллекция<select onchange="filters.collection=this.value">${[['','Все'],['PlushPepe','Plush Pepe'],['JellyBunny','Jelly Bunny'],['LushBouquet','Lush Bouquet'],['PreciousPeach','Precious Peach']].map(([k,t])=>`<option value="${k}" ${filters.collection===k?'selected':''}>${t}</option>`).join('')}</select></label>${[['model','Модель'],['backdrop','Фон'],['symbol','Символ']].map(([k,t])=>`<label>${t}<input maxlength="100" value="${esc(filters[k])}" placeholder="Любой" oninput="filters.${k}=this.value"></label>`).join('')}<button class="secondary" onclick="filters={collection:'',model:'',backdrop:'',symbol:''};render()">Сбросить фильтры</button></div>`:''}${mode!=='prices'?`<div class="row" style="margin-top:16px"><span>Количество</span><div class="stepper" style="flex:0"><button onclick="count(-1)">−</button><b>${Math.min(3,Math.max(1,prefs.count))}</b><button onclick="count(1)">+</button></div></div>`:''}<button class="primary" style="margin-top:15px" onclick="findGifts()" ${busy?'disabled':''}>${icon('gift')} ${busy?'Ищем…':'Найти подарки'}</button></div>${!membership?.member?accessPanel():''}${section('Результаты')}${found.length?found.map(giftCard).join(''):panel(`<div class="empty">${esc(searchStatus||'Выбери режим и начни поиск.')}</div>`)}${found.length&&searchStatus?`<p class="hint">${esc(searchStatus)}</p>`:''}`}
document.getElementById('screen').innerHTML=s;document.getElementById('nav').innerHTML=[['tracker','radar','Трекер'],['settings','sliders','Настройки'],['profile','user','Профиль']].map(([p,i,t])=>`<button class="${(page===p||(p==='profile'&&!['tracker','settings'].includes(page)))?'active':''}" onclick="go('${p}')">${icon(i)}${t}</button>`).join('')}
let deliveryInstructions='';
function deliveryPanel(){return `<div class="panel pad access"><div class="access-title">${icon('send')} <strong>Куда отправлять подборки</strong></div><p>Сейчас: ${esc(membership?.delivery?.title||'Личный чат с ботом')}</p><p>После поиска все найденные подарки придут одним сообщением в выбранный чат.</p><button class="primary" onclick="deliveryAction('link')">＋ Подключить свою группу</button><button class="secondary" onclick="deliveryAction('private')">💬 Отправлять в личный чат</button>${deliveryInstructions?`<div style="white-space:pre-wrap;overflow-wrap:anywhere;margin-top:16px">${esc(deliveryInstructions)}</div><button class="secondary" onclick="checkAccess(true)">Обновить статус</button>`:''}</div>`}
async function deliveryAction(action){try{const r=await requestApi('/api/delivery',{action});if(r.instructions)deliveryInstructions=r.instructions;else{deliveryInstructions='';membership={...membership,delivery:r.delivery};toast('Выбран личный чат')}render()}catch(e){toast(e.message)}}
function accessPanel(){let reason=membership?.reason;let sub=reason==='verification_failed'?'Не удалось проверить подписку. Попробуй ещё раз.':reason==='group_not_configured'?'Проверка ещё не настроена.':!tg?.initData?'Предпросмотр — проверка работает в Telegram.':'';if(membership?.member)return `<div class="panel pad access"><div class="access-title">${icon('shield')} <strong>Доступ открыт</strong></div><p>Подписка на @ZergowNft подтверждена.</p></div>`;return `<div class="panel unlock-card"><div class="unlock-top"><span class="unlock-icon">${icon('shield')}</span><span class="unlock-badge">FREE ACCESS</span></div><div class="unlock-kicker">GIFT RADAR × ZERGOW NFT</div><h2>Открой полный доступ</h2><p class="unlock-desc">${esc(cfg.access_text)}</p><div class="unlock-steps"><div><b>01</b><span><strong>Подпишись на @ZergowNft</strong><small>Наше NFT-сообщество</small></span></div><div><b>02</b><span><strong>Подтверди подписку</strong><small>Открой все режимы поиска бесплатно</small></span></div></div><button class="primary unlock-join" onclick="joinGroup()">${icon('send')} Подписаться на Zergow NFT</button><button class="secondary unlock-check" onclick="checkAccess(true)">${icon('shield')} Проверить подписку</button><div class="unlock-note">Без оплаты · Без пробного периода</div>${sub?`<p class="unlock-status" role="status">${esc(sub)}</p>`:''}</div>`}
function joinGroup(){const u=cfg.group_url;if(u!=='https://t.me/ZergowNft')return;if(tg?.initData&&tg.openTelegramLink)tg.openTelegramLink(u);else window.open(u,'_blank','noopener')}
async function checkAccess(show=false){if(!tg?.initData){if(show)toast('Открой приложение в Telegram');return false}try{membership=await requestApi('/api/me');if(!membership.member)found=[];if(show)toast(membership.member?'Доступ открыт':'Подписка не подтверждена')}catch(e){membership={member:false,reason:'verification_failed'};found=[];if(show)toast(e.message)}render();return membership.member}
function switchMode(k){if(busy)return;mode=k;found=[];searchStatus='';render()}
function giftCard(g){return `<article class="giftcard"><div class="gifthead"><div class="gifticon">${icon('gift')}</div><div><strong>${esc(g.name)}</strong><p>#${esc(g.number)}</p></div><span class="tag">NFT</span></div><div class="attrs">${[['Модель',g.model],['Фон',g.backdrop],['Символ',g.symbol],['Выпуск',g.quantity],['Цена в каталоге',g.price_ton!=null?g.price_ton+' TON':null]].filter(x=>x[1]).map(([k,v])=>`<div><span>${k}</span><b>${esc(v)}</b></div>`).join('')}</div><button class="secondary" style="width:100%" onclick="openGift('${esc(g.slug)}')">Открыть подарок ${icon('chev')}</button></article>`}
function openGift(slug){if(!/^[A-Za-z]+-\d+$/.test(slug))return;const u='https://t.me/nft/'+slug;if(tg?.initData&&tg.openTelegramLink)tg.openTelegramLink(u);else window.open(u,'_blank','noopener')}
async function findGifts(){if(busy)return;if(!tg?.initData){toast('Поиск доступен после запуска бота в Telegram');return}busy=true;found=[];searchStatus='Ищем публичные карточки…';render();try{const result=await requestApi(mode==='prices'?'/api/prices':'/api/random',mode==='prices'?{mode:budget}:{count:Math.min(3,Math.max(1,prefs.count)),...(mode==='filters'?{filters}: {})});found=result.gifts;searchStatus=found.length?(mode==='prices'?'Цены внесены администратором, проверяй актуальность.':'Подборка публичных карточек; продажа не гарантирована.'):'Совпадений пока нет. Попробуй другой запрос.';const d=result.delivery;if(d?.kind==='group')searchStatus+=' Отправлено в группу «'+d.title+'».';else if(d?.kind==='private')searchStatus+=d.fallback?' Группа недоступна: подборка в личном чате.':' Подборка отправлена в чат с ботом.';else if(d?.kind==='failed')searchStatus+=' Не удалось отправить в Telegram.';else if(d?.kind==='blocked'){found=[];searchStatus='Подписка не подтверждена.';await checkAccess()}if(prefs.vibration)tg?.HapticFeedback?.notificationOccurred('success')}catch(e){searchStatus=e.message;await checkAccess()}finally{busy=false;render()}}
function ticketList(onlyReplies){const list=onlyReplies?supportTickets.filter(t=>t.reply):supportTickets;if(!list.length)return `<div class="empty">${esc(supportStatus||(onlyReplies?'Уведомлений пока нет':'Обращений пока нет'))}</div>`;return list.map(t=>`<div class="item"><div class="copy"><strong>№${t.id} · ${t.kind==='complaint'?'Жалоба':'Вопрос'}</strong><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(t.body)}</p><span class="sub">${t.reply?'Ответ получен':'Ожидает ответа'}</span>${t.reply?`<p style="color:var(--fg);white-space:pre-wrap;overflow-wrap:anywhere">${esc(t.reply)}</p>`:''}</div></div>`).join('')}
async function requestApi(path,data={}){if(!tg?.initData)throw Error('Открой Mini App в Telegram');const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,initData:tg.initData})});const result=await r.json();if(!r.ok)throw Error(result.error||'Ошибка сервера');return result}
async function loadTickets(){if(!tg?.initData)return;try{const result=await requestApi('/api/tickets');supportTickets=result.tickets;supportStatus=''}catch(e){supportStatus=e.message}if(['support','notifications'].includes(page))render()}
function support(complaint){sheet(complaint?'Жалоба':'Вопрос в поддержку',`<textarea id="ticketBody" maxlength="2000" placeholder="Что случилось?"></textarea><button class="secondary" disabled>＋ Скрин (позже)</button><button class="primary" id="ticketSend" onclick="submitTicket(${complaint})">${icon('send')} Отправить</button><p class="notice">${tg?.initData?'Ответ появится в разделе поддержки':'Предпросмотр: отправка доступна в Telegram'}</p>`)}
async function submitTicket(complaint){const field=document.getElementById('ticketBody'),btn=document.getElementById('ticketSend');if(!field.value.trim()){toast('Введите текст обращения');return}btn.disabled=true;try{const result=await requestApi('/api/ticket',{kind:complaint?'complaint':'question',body:field.value});closeSheet();toast('Обращение №'+result.id+' принято');await loadTickets()}catch(e){toast(e.message);btn.disabled=false}}
function openHandle(handle){let url='https://t.me/'+handle.slice(1);if(tg?.initData&&tg.openTelegramLink)tg.openTelegramLink(url);else window.open(url,'_blank','noopener')}
async function sync(){if(location.protocol==='file:')return;try{let r=await fetch('/api/config',{cache:'no-store'});if(!r.ok)return;let next=await r.json();if(next.version!==cfg.version||JSON.stringify(next)!==JSON.stringify(cfg)){cfg=next;render()}}catch(e){}}render();sync();checkAccess();setInterval(sync,5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){sync();checkAccess();if(['support','notifications'].includes(page))loadTickets()}});setInterval(()=>{if(!document.hidden&&['support','notifications'].includes(page)&&!document.querySelector('.sheet'))loadTickets()},15000);
</script></body></html>
