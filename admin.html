<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Gift Radar — Control</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box} :root{--bg:#0e1017;--surface:#181b25;--line:#292d3a;--muted:#a2a7b8;--accent:#b9a7ff;--green:#83dec0} body{margin:0;background:radial-gradient(ellipse at 85% 0%,#29213f 0%,transparent 38%),var(--bg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5f4fa;min-height:100dvh}main{max-width:720px;margin:auto;padding:26px 18px 112px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:700}.tag{border:1px solid #3d3651;border-radius:20px;padding:6px 12px;font-size:11px;color:var(--accent)}h1{font-size:31px;letter-spacing:-1.3px;line-height:1.15;margin:8px 0 8px}h2{font-size:19px;margin:0 0 12px;letter-spacing:-.4px}p{margin:0 0 12px;color:var(--muted)}.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}.num{font-size:27px;font-weight:650;letter-spacing:-1px}.small{font-size:12px;color:var(--muted)}.accent{color:var(--accent)}.green{color:var(--green)}label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}input,textarea{width:100%;background:#10121a;color:#f5f4fa;border:1px solid #303442;border-radius:12px;padding:12px;font:inherit;outline:none}input:focus,textarea:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:84px}button{border:0;border-radius:12px;padding:12px 15px;background:#2c2b3c;color:#f6f4ff;font-size:14px;font-weight:600;line-height:1.3;font-family:inherit;cursor:pointer;min-height:44px}button:disabled{opacity:.45;cursor:default}button.primary{background:var(--accent);color:#191329}button.full{width:100%;margin-top:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row button{flex:1}.item{padding:14px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.item:last-child{border-bottom:0}.item p{white-space:pre-wrap}.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}.switch input{width:22px;accent-color:var(--accent)}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,720px);padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:#11131ded;backdrop-filter:blur(20px);border-top:1px solid #30313c;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;z-index:5}nav button{background:transparent;font-size:11px;color:var(--muted);padding:9px 2px}nav button span{display:block;font-size:20px;margin-bottom:4px}nav button.active{color:var(--accent);background:#2a263d}#notice{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;width:min(90%,580px);padding:14px;background:#302943;border:1px solid #5b4c78;border-radius:14px;z-index:6;overflow-wrap:anywhere;box-shadow:0 6px 30px #0008}#notice[hidden],nav[hidden]{display:none} .danger{color:#ffc0ca}.divider{height:1px;background:var(--line);margin:15px 0}.sub{font-size:12px;color:var(--muted);margin-top:8px} .wide{margin-top:10px} @media(max-width:350px){main{padding:16px 12px 100px}.card{padding:14px}}
</style></head><body><main><header><div class="brand">◈ GIFT RADAR / CONTROL</div><div class="tag">OWNER</div></header><section id="root"><h1>Панель управления</h1><p>Проверяем доступ…</p></section></main><div id="notice" role="status" hidden></div><nav id="nav" hidden></nav><script>
'use strict';const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const root=document.getElementById('root'),nav=document.getElementById('nav'),notice=document.getElementById('notice');let state=null,tab='overview',busy=false,seq=0;const tabs=[['overview','◈','Обзор'],['design','✧','Дизайн'],['partners','◎','Партнёры'],['system','⚙','Система']];const statusNames={pending:'На рассмотрении',approved:'Одобрена',rejected:'Отклонена',active:'Активна (отмечена)',disabled:'Отключена (отмечена)'};function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n}function add(parent,...children){parent.append(...children);return parent}function card(title){const n=el('div',undefined,'card');if(title)n.append(el('h2',title));return n}function heading(title,desc){root.replaceChildren(el('h1',title),el('p',desc))}function button(text,fn,cls=''){const n=el('button',text,cls);n.type='button';n.addEventListener('click',()=>run(fn));return n}function field(parent,label,value,max,multi=false){const l=el('label',label),n=el(multi?'textarea':'input');n.value=value??'';n.maxLength=max;l.append(n);parent.append(l);return n}function message(text){notice.textContent=text;notice.hidden=false;const n=++seq;setTimeout(()=>{if(seq===n)notice.hidden=true},5000)}async function api(action,data={}){if(!tg?.initData)throw Error('Открой панель через /admin в Telegram.');const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,action,initData:tg.initData})});const d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка сервера');return d}async function run(fn){if(busy)return;busy=true;try{await fn()}catch(e){message(e.message||'Ошибка')}finally{busy=false}}async function refresh(){state=await api('overview');render()}function stat(n,label){return add(el('div',undefined,'stat'),el('div',n,'num'),el('div',label,'small'))}function render(){nav.replaceChildren(...tabs.map(([id,icon,label])=>{const b=button('',async()=>{tab=id;render()},id===tab?'active':'');b.append(el('span',icon),document.createTextNode(label));return b}));nav.hidden=false;if(tab==='overview')overview();if(tab==='design')design();if(tab==='partners')partnerPage();if(tab==='system')system()}
function overview(){heading('Управление','Рабочее пространство владельца');const c=state.counts;root.append(add(el('div',undefined,'stats'),stat(c.open_tickets,'Открытые обращения'),stat(c.linked_groups,'Подключённые группы'),stat(c.seen_gifts,'Записи истории NFT'),stat(state.partners.filter(x=>x.status==='pending').length,'Новые заявки*')));const a=card('Состояние сервиса');a.append(el('div',state.market_enabled?'● Рыночный API настроен':'○ Рыночный API недоступен',state.market_enabled?'green':'small'),el('p',state.log_chat?'Служебная группа подключена':'Служебная группа не подключена','sub'),button('Обновить обзор',refresh,'full'));root.append(a);const b=card('Поддержка');b.append(el('p','Читай обращения и отвечай прямо из панели.'),button('Открыть обращения',ticketsPage,'primary full'));root.append(b,el('p','* Среди последних 20 заявок. Статистика относится к текущей базе.','small'))}
function design(){heading('Оформление','Изменения применяются к основному интерфейсу.');const c=card('Бренд и тексты'),cfg=state.config,fields={};for(const [key,label,max,multi] of [['title','Название',64,false],['banner','Верхний баннер',240,true],['welcome','Приветствие',500,true],['button_text','Кнопка запуска',48,false],['support','Контакт поддержки',33,false],['access_text','Текст обязательной подписки',500,true]])fields[key]=field(c,label,cfg[key],max,multi);const sw=el('label',undefined,'switch'),check=el('input');check.type='checkbox';check.checked=cfg.banner_enabled;sw.append(el('span','Показывать верхний баннер'),check);c.append(sw,button('Сохранить изменения',async()=>{const config=Object.fromEntries(Object.entries(fields).map(([k,v])=>[k,v.value]));config.banner_enabled=check.checked;const r=await api('save',{config});state.config=r.config;render();message(r.warning||'Настройки сохранены')},'primary full'));root.append(c)}
function partnerPage(){heading('Партнёры','Рассмотрение заявок на подключение.');const c=card('Последние заявки');if(!state.partners.length)c.append(el('p','Заявок пока нет.'));for(const r of state.partners){const item=el('div',undefined,'item');item.append(el('strong','#'+r.id+' · @'+r.username),el('p',statusNames[r.status]||r.status));const choices={pending:[['Одобрить','approved'],['Отклонить','rejected']],approved:[['Отметить активным','active'],['Отклонить','rejected']],active:[['Отметить отключённым','disabled']]}[r.status]||[];if(choices.length)item.append(add(el('div',undefined,'row'),...choices.map(([text,status])=>button(text,async()=>{const d=await api('partner_review',{id:r.id,status});await refresh();message(d.note)},status==='approved'?'primary':''))));c.append(item)}root.append(c,el('p','Статус заявки не запускает и не останавливает бота. Развёртывание выполняется отдельно.','small'))}
async function ticketsPage(){const d=await api('tickets');heading('Обращения','Последние 50 сообщений поддержки');const c=card();if(!d.tickets.length)c.append(el('p','Обращений нет.'));for(const t of d.tickets){const item=el('div',undefined,'item');item.append(el('strong','#'+t.id+' · '+(t.kind==='complaint'?'Жалоба':'Вопрос')),el('p',t.body));if(t.reply!==null)item.append(el('p','Ответ: '+t.reply,'green'));else{const input=field(item,'Ответ','',2000,true);item.append(button('Отправить ответ',async()=>{const r=await api('reply',{id:t.id,reply:input.value});await ticketsPage();message(r.delivered?'Ответ отправлен':'Ответ сохранён, Telegram не доставил сообщение')},'primary full'))}c.append(item)}root.append(c,button('Вернуться к обзору',async()=>refresh(),'full'))}
function system(){heading('Система','Лимиты, служебные события и каталог.');const l=state.limits,f=state.finance,lc=card('Дневные ограничения'),fields={};lc.append(el('p','Расход сегодня: '+(f.cost/1e9).toFixed(4)+' TON · запросов: '+f.requests),el('p',f.uncertain?'Есть неподтверждённый расход — новые запросы остановлены.':'Расход подтверждён заголовками API.','small'));for(const [k,label] of [['search_daily','Поисков на пользователя'],['detail_daily','Проверок NFT'],['batch_max','Максимум NFT в подборке'],['cooldown','Пауза, сек.']]){const i=field(lc,label,l[k],4);i.type='number';fields[k]=i;}const money=field(lc,'Дневной бюджет, TON',l.budget_nano/1e9,12);money.type='number';money.step='0.002';function tick(label,val){const row=el('label',label),i=el('input');i.type='checkbox';i.checked=val;row.append(i);lc.append(row);return i}const paid=tick('Разрешить платные запросы',l.paid),open=tick('Поиск включён',l.search_open);lc.append(el('p',state.public_market_approved?'Рыночный доступ для пользователей разрешён в конфигурации.':'Рыночный доступ пока ограничен владельцем.','small'),el('p','Сброс счётчиков: 00:00 UTC. Неизвестная стоимость останавливает запросы.','small'),button('Сохранить ограничения',async()=>{const data={};for(const k of Object.keys(fields))data[k]=Number(fields[k].value);data.budget_nano=Math.round(Number(money.value)*1e9);data.paid=paid.checked;data.search_open=open.checked;await api('save_limits',{limits:data});await refresh();message('Лимиты сохранены')},'primary full'));root.append(lc);const a=card('Лимит запросов'),q=el('div','—','num');a.append(q,el('p','Остаток бесплатной квоты'),button('Проверить остаток',async()=>{const r=await api('quota');q.textContent=r.remaining??'Неизвестно'},'full'));root.append(a);const b=card('Служебные логи');b.append(el('p',state.log_chat?'● Группа подключена':'○ Группа не подключена',state.log_chat?'green':'small'));const input=field(b,'ID приватной группы',state.log_chat,20);input.placeholder='-100…';b.append(el('p','Добавь бота администратором и узнай ID через /groupid. Группа должна принадлежать тебе.','small'),button('Подключить группу',async()=>{await api('logs_bind',{chat_id:input.value});await refresh();message('Группа подключена')},'primary full'),add(el('div',undefined,'row wide'),button('Тестовый лог',async()=>{await api('logs_test');message('Тестовый лог отправлен')}),button('Отключить',async()=>{await api('logs_off');await refresh();message('Логи отключены')})));root.append(b);const c=card('Каталог цен');c.append(el('p','Ручной каталог базового поиска. Записи действуют 24 часа.'),button('Открыть каталог',catalogPage,'full'));root.append(c)}
async function catalogPage(){const d=await api('catalog');heading('Каталог цен','Ручные записи базового поиска');const c=card('Новый лот');const slug=field(c,'NFT slug','',100),price=field(c,'Цена TON','',20);c.append(button('Добавить',async()=>{await api('lot_add',{slug:slug.value,price:price.value});await catalogPage();message('Сохранено')},'primary full'));root.append(c);const list=card('Последние записи');for(const r of d.lots){const item=el('div',undefined,'item');item.append(el('strong',r.slug),el('p',r.price_milli/1000+' TON'),button('Удалить',async()=>{await api('lot_remove',{slug:r.slug});await catalogPage();message('Удалено')}));list.append(item)}if(!d.lots.length)list.append(el('p','Каталог пуст.'));root.append(list,button('Вернуться в систему',async()=>refresh(),'full'))}
(async()=>{try{await refresh()}catch(e){heading('Доступ закрыт',e.message);nav.hidden=true}})();
</script></body></html>
